name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Testes e APK
        id: build
        shell: bash
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          set -o pipefail
          ./gradlew --console=plain testReleaseUnitTest assembleRelease 2>&1 | tee build.log

      - name: Lint
        if: success()
        continue-on-error: true
        run: ./gradlew --console=plain lintRelease > lint.log 2>&1

      - name: Conferir APK
        if: success()
        shell: bash
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          { $BT/aapt2 dump badging "$APK" | grep -E "package:|uses-permission|sdkVersion|application-label:|uses-feature|native-code"; ls -la "$APK"; $BT/apksigner verify --print-certs "$APK" | head -3; } | tee apk-info.txt

      - name: Publicar resultado no branch builds
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/out/tests
          cp build.log /tmp/out/ 2>/dev/null || echo "sem log" > /tmp/out/build.log
          cp apk-info.txt lint.log /tmp/out/ 2>/dev/null || true
          cp app/build/reports/lint-results-release.txt /tmp/out/ 2>/dev/null || true
          cp app/build/test-results/testReleaseUnitTest/*.xml /tmp/out/tests/ 2>/dev/null || true
          APK=app/build/outputs/apk/release/app-release.apk
          if [ -f "$APK" ]; then
            split -b 45m -d "$APK" /tmp/out/Vitral.apk.part
            sha256sum "$APK" | cut -d' ' -f1 > /tmp/out/Vitral.sha256
          fi
          echo "${{ job.status }} $GITHUB_SHA" > /tmp/out/STATUS
          cd /tmp/out
          git init -q -b builds
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "build $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" builds
